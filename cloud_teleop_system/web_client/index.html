<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRCOBOT Cloud Teleop</title>
    <style>
        body { font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; margin: 0; padding: 20px; }
        h1 { color: #4CAF50; }
        .video-container { width: 80%; max-width: 1280px; aspect-ratio: 16/9; background-color: #000; border: 2px solid #333; border-radius: 8px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .controls { margin-top: 20px; display: flex; gap: 15px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; background-color: #4CAF50; color: white; transition: background-color 0.2s; }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .status-panel { margin-top: 20px; background-color: #2d2d2d; padding: 15px; border-radius: 8px; width: 80%; max-width: 1280px; display: flex; justify-content: space-between;}
        .status-item { display: flex; flex-direction: column; }
        .status-label { font-size: 12px; color: #aaa; }
        .status-value { font-size: 18px; font-weight: bold; }
        .connected { color: #4CAF50; }
        .disconnected { color: #f44336; }
    </style>
</head>
<body>

    <h1>FRCOBOT Ultra-Low Latency Teleoperation</h1>
    
    <div class="video-container">
        <!-- Allows playing without user interaction on modern browsers if muted -->
        <video id="remoteVideo" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button id="connectBtn">Connect to Robot</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
    </div>

    <div class="status-panel">
        <div class="status-item">
            <span class="status-label">Signaling Server</span>
            <span id="sigStatus" class="status-value disconnected">Disconnected</span>
        </div>
        <div class="status-item">
            <span class="status-label">WebRTC Peer</span>
            <span id="rtcStatus" class="status-value disconnected">Disconnected</span>
        </div>
        <div class="status-item">
            <span class="status-label">Data Channel (Control)</span>
            <span id="dataStatus" class="status-value disconnected">Closed</span>
        </div>
        <div class="status-item">
            <span class="status-label">Gamepad</span>
            <span id="gamepadStatus" class="status-value disconnected">Not Found</span>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
